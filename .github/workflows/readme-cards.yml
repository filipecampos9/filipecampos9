name: Refresh README cards

on:
  schedule:
    - cron: "17 5 * * *"   # every morning, 05:17 UTC
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]
    paths: [config.json, scripts/**, fonts/**, assets/**]

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install fonttools pillow

      - name: Fetch contribution calendar and repo stats
        run: python scripts/fetch_data.py
        env:
          # Optional: a fine-grained PAT in the CARDS_TOKEN secret also counts
          # private contributions and private featured repos.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render README cards (hero, tiles, activity, repos, heatmap)
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards data
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
